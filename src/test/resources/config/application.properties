# Sobrepõe o application.properties principal nos testes (classpath:/config/ tem precedência).
# Agendamento desligado: os testes chamam o dispatcher direto e o status não muda sozinho.
activation.dispatch.enabled=false
# Base URL qualquer para o grupo provider; os testes com WireMock sobrescrevem com a porta dinâmica.
spring.http.serviceclient.provider.base-url=http://localhost:9
# Resource Server: jwt() do spring-security-test não usa o decoder; o endereço só precisa existir para o Boot criá-lo.
# JwtValidationIntegrationTests aponta o jwk-set-uri para o WireMock.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9/jwks
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://issuer.test
spring.security.oauth2.resourceserver.jwt.audiences=ativacao-api
