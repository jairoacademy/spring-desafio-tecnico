spring.application.name=springdesafiotecnico

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Provedor externo de ativação. PROVIDER_URL é obrigatória.
spring.http.serviceclient.provider.base-url=${PROVIDER_URL}
spring.http.serviceclient.provider.connect-timeout=${PROVIDER_CONNECT_TIMEOUT:2s}
spring.http.serviceclient.provider.read-timeout=${PROVIDER_READ_TIMEOUT:5s}

# Resource Server: chaves do JWKS, emissor e audiência aceitos. As três são obrigatórias.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE}

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,prometheus
# Histogramas para p95/p99 no Prometheus (histogram_quantile): API e chamadas ao provedor.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true

# Tracing: amostragem e exportação OTLP. O Boot cria o exportador mesmo com endpoint vazio e falha na subida
# (spring.config.activate não tem on-property); por isso a exportação tem chave própria, desligada por padrão.
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.tracing.export.otlp.enabled=${OTLP_TRACING_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
# O starter traz o registro OTLP de métricas; as métricas saem só pelo Prometheus.
management.otlp.metrics.export.enabled=false

# Logs em JSON (um objeto por linha); o formato Logstash copia o MDC para o topo: traceId e spanId.
logging.structured.format.console=logstash

# Erros que escapam do Spring MVC (ex.: filtros) também não expõem detalhes internos.
server.error.include-stacktrace=never
server.error.include-message=never
