# Desenvolvimento local apenas: aponta para o PostgreSQL, o WireMock e o emissor de tokens do compose.yaml.
spring.datasource.url=jdbc:postgresql://localhost:5432/ativacao
spring.datasource.username=ativacao
spring.datasource.password=ativacao
spring.http.serviceclient.provider.base-url=http://localhost:8089
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8091/default/jwks
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8091/default
spring.security.oauth2.resourceserver.jwt.audiences=ativacao-api
