services:
  postgres:
    image: postgres:18
    container_name: ativacao-db
    environment:
      POSTGRES_DB: ativacao
      POSTGRES_USER: ativacao
      POSTGRES_PASSWORD: ativacao
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ativacao -d ativacao"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
