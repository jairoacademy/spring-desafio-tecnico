name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build e testes
        run: ./mvnw -B verify

  compose-smoke:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sobe app, banco e mock do provedor
        run: docker compose up --build --wait
      - name: Aplicação roda com usuário não-root
        run: |
          uid=$(docker compose exec -T app id -u)
          echo "uid=$uid"
          test "$uid" != "0"
      - name: Readiness da aplicação
        run: curl -fsS localhost:8080/actuator/health/readiness
      - name: Mock do provedor responde
        run: curl -fsS -X POST localhost:8089/provider/v1/activate
      - name: Logs do Compose
        if: failure()
        run: docker compose logs
      - name: Derruba o ambiente
        if: always()
        run: docker compose down -v
