name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build e testes
        run: ./mvnw -B verify

  compose-smoke:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sobe app, banco, mock do provedor e emissor de tokens
        run: docker compose up --build --wait
      - name: Aplicação roda com usuário não-root
        run: |
          uid=$(docker compose exec -T app id -u)
          echo "uid=$uid"
          test "$uid" != "0"
      - name: Readiness da aplicação
        run: curl -fsS localhost:8080/actuator/health/readiness
      - name: Mock do provedor responde
        run: curl -fsS -X POST localhost:8089/provider/v1/activate
      - name: Token de desenvolvimento aceito pela aplicação
        run: |
          token=$(curl -fsS -X POST localhost:8091/default/token \
            -d grant_type=client_credentials -d client_id=sistema-leitura -d client_secret=dev \
            -d scope=activation:read | jq -r .access_token)
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            localhost:8080/api/v1/requests)
          echo "status=$status"
          test "$status" = "200"
      - name: Logs do Compose
        if: failure()
        run: docker compose logs
      - name: Derruba o ambiente
        if: always()
        run: docker compose down -v
